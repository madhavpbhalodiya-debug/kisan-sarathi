<!DOCTYPE html>
<html lang="en">

<head>
  

    <title>Forgot Password - Kisan Sarathi</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3f7ef;
        }

        .forgot-container {
            width: 400px;
            margin: 100px auto;
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #4a7e2d;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            background-color: #4a7e2d;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .reset-btn:hover {
            background-color: #35651f;
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #4a7e2d;
            text-decoration: none;
        }
    </style>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"></head>

<body>

    <div class="forgot-container">

        <h2>🌱 KISAN SARATHI</h2>

        <p class="subtitle">
            Forgot Password
        </p>

        <form>

            <label>Mobile Number</label>

            <input type="tel"
                   placeholder="Enter your mobile number"
                   maxlength="10"
                   required>

            <button type="submit" class="reset-btn">
                Send OTP
            </button>

        </form>

        <a href="farming.html" class="back-login">
            ← Back to Login
        </a>

    </div>

</body>

</html>
