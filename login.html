<!DOCTYPE html>
<html lang="en">
<head>
  
    <title>Login - Kisan Sarathi</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3f7ef;
        }

        .login-container {
            width: 400px;
            margin: 80px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.15);
        }

        .login-container h2 {
            text-align: center;
            color: #4a7e2d;
            margin-bottom: 10px;
        }

        .login-container p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #4a7e2d;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background-color: #35651f;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-bottom: 20px;
            color: #4a7e2d;
            text-decoration: none;
            font-size: 14px;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #4a7e2d;
            text-decoration: none;
            font-weight: bold;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #555;
            text-decoration: none;
        }
    </style>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"></head>

<body>

    <div class="login-container">

        <h2>🌱 KISAN SARATHI</h2>

        <p>Farmer Login</p>

        <form>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel"
                       placeholder="Enter mobile number"
                       maxlength="10"
                       required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password"
                       placeholder="Enter password"
                       required>
            </div>

            <a href="forgot-password.html" class="forgot">
                Forgot Password?
            </a>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="registeration_form.html">Register Now</a>
        </div>

        <a href="farming.html" class="back-home">
            ← Back to Home
        </a>

    </div>

</body>
</html>
