<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Farmer Registration - Kisan Sarathi</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3f7ef;
        }

        .registration-container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(10,2,50,5.15);
        }

        .registration-container h2 {
            text-align: center;
            color: #4a7e2d;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .form-group textarea {
            height: 80px;
            resize: none;
        }

        .register-btn {
            width: 100%;
            padding: 12px;
            background-color: #4a7e2d;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background-color: #35651f;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #4a7e2d;
        }
    </style>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"></head>

<body>

    <div class="registration-container">

        <h2>🌱 Farmer Registration</h2>

        <form>

            <div class="form-group">
                <label>Farmer Name</label>
                <input type="text" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" placeholder="Enter mobile number"
                       maxlength="10" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Enter email address">
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" required>
            </div>

            <div class="form-group">
                <label>State</label>
                <select required>
                    <option value="">Select State</option>
                    <option>Gujarat</option>
                    <option>Rajasthan</option>
                    <option>Maharashtra</option>
                    <option>Madhya Pradesh</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>District</label>
                <input type="text" placeholder="Enter district" required>
            </div>

            <div class="form-group">
                <label>Village</label>
                <input type="text" placeholder="Enter village name" required>
            </div>

            <div class="form-group">
                <label>Land Area</label>
                <input type="text" placeholder="Enter land area">
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea placeholder="Enter your address"></textarea>
            </div>

            <button type="submit" class="register-btn">
                Register Now
            </button>

        </form>

        <a href="farming.html" class="back-home">
            ← Back to Home
        </a>

    </div>

</body>
</html>
